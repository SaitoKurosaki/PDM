<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>
    <link rel="stylesheet" href="../src/output.css" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Changa+One:ital@0;1&family=DynaPuff:wght@400..700&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap");
    </style>
  </head>
  <body class="bg-[#180E06] font-[Montserrat] text-white">
    <main class="flex justify-center items-center h-dvh">
      <form
        class="border border-[#fda900]/40 rounded-xl p-5 m-5"
        method="post"
        action="http://localhost:3000/signup"
      >
        <div class="flex flex-col">
          <div class="flex flex-col justify-center items-center p-5 gap-2 mb-2">
            <img src="../Pictures/pdm.png" class="w-25" />
            <p
              class="flex w-full flex-col items-center text-center font-extrabold text-xl tracking-widest relative after:absolute after:h-1 after:w-1/2 after:bg-[#fda900] after:-bottom-2 after:rounded-lg"
            >
              PAMBAYANG DALUBHASAAN
              <span class="text-[#fda900]">NG MARILAO</span>
            </p>
          </div>
          <div class="text-center mb-10">
            <p class="text-2xl font-bold tracking-widest">CREATE ACCOUNT</p>
            <p class="text-sm text-[#ffffff9d]">
              Please fill in the details to sign up
            </p>
          </div>
          <div class="flex flex-col gap-2">
            <div class="flex flex-col justify-start">
              <label class="mb-1">Full Name</label>
              <div
                class="flex border-[#fda900]/40 border rounded-md w-full p-2 gap-2"
              >
                <img src="../svg/user.svg" class="w-8" />
                <input
                  placeholder="Enter Your Full Name"
                  name="full_name"
                  required
                  type="text"
                  class="w-full focus:outline-none focus:ring-0 text-base"
                />
              </div>
            </div>
            <div class="flex flex-col justify-start">
              <label class="mb-1">Email Address</label>
              <div
                class="flex border-[#fda900]/40 border rounded-md w-full p-2 gap-2"
              >
                <img src="../svg/email-2.svg" class="w-8" />
                <input
                  placeholder="Enter your email"
                  name="email"
                  required
                  type="email"
                  class="w-full focus:outline-none focus:ring-0 text-base"
                />
              </div>
            </div>
            <div class="flex flex-col">
              <label class="mb-1">Password</label>
              <div
                class="flex justify-between border-[#fda900]/40 border rounded-md w-full p-2"
              >
                <div class="flex gap-2">
                  <img src="../svg/lock.svg" class="w-8" />
                  <input
                    placeholder="Enter your password"
                    name="password"
                    type="password"
                    required
                    class="w-full focus:outline-none focus:ring-0 text-base"
                  />
                </div>
                <img src="../svg/closedeye.svg" class="w-8" />
              </div>
            </div>
            <div class="flex flex-col">
              <label class="mb-1">Confirm Password</label>
              <div
                class="flex justify-between border-[#fda900]/40 border rounded-md w-full p-2"
              >
                <div class="flex gap-2">
                  <img src="../svg/lock.svg" class="w-8" />
                  <input
                    placeholder="Enter your password"
                    name="confirm_password"
                    type="password"
                    required
                    class="w-full focus:outline-none focus:ring-0 text-base"
                  />
                </div>
                <img src="../svg/closedeye.svg" class="w-8" />
              </div>
            </div>
          </div>
          <div class="text-center flex flex-col gap-2 mt-5">
            <button class="bg-[#fda900] p-2 rounded-md text-black font-bold">
              Sign Up
            </button>
            <div class="h-0.5 w-full bg-[#fda900]/20 my-5"></div>
            <p class="pb-5">
              Already have an account?
              <a
                class="text-[#fda900] cursor-pointer"
                href="https://pdmmarilao.com/login.html"
                >Login</a
              >
            </p>
          </div>
        </div>
      </form>
    </main>
  </body>
</html>
